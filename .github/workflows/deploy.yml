name: Objava strani
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *' # vsakih 6 ur (0:17, 6:17, 12:17, 18:17 UTC); GitHub lahko zamakne za nekaj ur
  workflow_dispatch: {}
  repository_dispatch:
    types: [osvezi]        # za samodejno osvežitev iz Google Apps Script
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Google Drive brez ključa: GitHub OIDC -> Workload Identity Federation (projekt birovolk-splet)
      # -> service account splet-foto (samo Viewer na mapi »Splet – fotografije«).
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/18377101261/locations/global/workloadIdentityPools/github/providers/birovolk-si
          service_account: splet-foto@birovolk-splet.iam.gserviceaccount.com
      - run: npm run build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BEHOLD_FEED_URL: ${{ secrets.BEHOLD_FEED_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v5
