name: Objava strani
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'   # vsako noč ob ~3:17 po slovenskem času (UTC+1)
  workflow_dispatch: {}
  repository_dispatch:
    types: [osvezi]        # za samodejno osvežitev iz Google Apps Script
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # Google Drive brez ključa: GitHub OIDC -> Workload Identity Federation (projekt birovolk-splet)
      # -> service account splet-foto (samo Viewer na mapi »Splet – fotografije«).
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/18377101261/locations/global/workloadIdentityPools/github/providers/birovolk-si
          service_account: splet-foto@birovolk-splet.iam.gserviceaccount.com
      - run: npm run build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BEHOLD_FEED_URL: ${{ secrets.BEHOLD_FEED_URL }}
          # Začasno, dokler www.birovolk.si kaže na staro stran. Po preklopu DNS to vrstico (in komentar) izbriši.
          SITE_URL: https://mihavolk79.github.io/birovolk.si
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v5
