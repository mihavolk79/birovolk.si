:root{--bg:#ffffff;--fg:#111111;--sub:#6b6b6b;--soft:#444444;--rule:#dddddd;--tile:#f1f1f1;--dot:#d40000;color-scheme:light;

:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#f2f2f2;--sub:#9a9a9a;--soft:#c8c8c8;--rule:#2a2a2a;--tile:#1c1c1c;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Barlow Semi Condensed',Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{padding-left:clamp(16px,3vw,40px);padding-right:clamp(16px,3vw,40px)}
.cond{font-family:'Barlow Condensed',Arial,sans-serif}
.dot{color:var(--dot)}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px;padding-top:24px;padding-bottom:24px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;min-height:44px}
.logo span:first-child{font-family:'Barlow Condensed',Arial,sans-serif;font-size:22px;font-weight:600;letter-spacing:.3em}

nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;font-size:16px}
nav a{text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
nav a[aria-current="page"],.lang button[aria-pressed="true"]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.lang{display:flex;gap:14px}
.lang button,.sw{background:transparent;border:0;color:var(--sub);font:inherit;font-size:15px;cursor:pointer;min-height:44px;padding:0}
.lang a{color:var(--sub);font-size:15px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.lang a[aria-current="true"]{color:var(--fg);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.sw{display:inline-flex;align-items:center}
.sw .track{position:relative;width:44px;height:24px;border-radius:12px;border:1px solid var(--fg);background:transparent;display:inline-block}
.sw .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--fg);transition:transform .2s}
.sw[aria-checked="true"] .track{background:var(--fg)}
.sw[aria-checked="true"] .knob{background:var(--bg);transform:translateX(20px)}
main{padding-bottom:96px}
h1.big,blockquote.big{margin:0;font-family:'Barlow Condensed',Arial,sans-serif;font-weight:300;line-height:.95}
.lbl{margin:0;font-size:15px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--sub)}
.sec{display:flex;flex-direction:column;gap:16px;margin-top:72px}
[hidden]{display:none!important}
.lead{margin:0;font-size:20px;line-height:1.55;color:var(--soft);max-width:62ch}
.intro{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:32px 48px;align-items:end;padding-top:32px}
/* home */
.quote{padding-top:48px;display:flex;flex-direction:column;gap:16px}
.quote figcaption{font-size:16px;letter-spacing:.04em;color:var(--sub)}
.news-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.news-head a{color:var(--sub);font-size:15px}
.posts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:24px}
.post{text-decoration:none;display:flex;flex-direction:column;gap:8px}
.post .img{aspect-ratio:1/1;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:.06em;color:var(--sub)}
.post .d{font-size:14px;color:var(--sub)}
.sel{list-style:none;margin:0;padding:0;display:grid;grid-auto-rows:1fr} /* vse vrste enako visoke kot najvišja */
.sel li{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) var(--wp,118px) var(--wc,124px);gap:4px 32px;align-items:baseline;padding:14px 0;border-top:1px solid var(--rule)}
.sel .no{font-size:15px;color:var(--sub)}
.sel .nm{font-family:'Barlow Condensed',Arial,sans-serif;font-size:28px;font-weight:300;line-height:1.1}

.sel .nm a{color:inherit;text-decoration:none}
.sel .nm a:hover,.sel .nm a:focus-visible{text-decoration:underline;text-underline-offset:4px}
.ptab tr.hit{animation:hit 2.4s ease-out}

@media (max-width:1100px){.sel li{grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) max(var(--wp,118px),var(--wc,124px));grid-template-rows:auto 1fr;gap:4px 24px}.sel .no,.sel .iv,.sel .nm{grid-row:span 2}.sel .ty{grid-column:4;text-align:left;align-self:start}}
.more{align-self:flex-start;font-size:18px;text-underline-offset:6px;min-height:44px;display:inline-flex;align-items:center}

.grp{display:grid;grid-template-columns:minmax(200px,1fr) 3fr;gap:16px 48px;padding-top:20px;border-top:1px solid var(--rule)}
.grp h2{margin:0;font-family:'Barlow Condensed',Arial,sans-serif;font-size:36px;font-weight:300;line-height:1.05}
.grp ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:4px 40px}
.grp li{display:flex;flex-direction:column;gap:2px;padding:10px 0}
.grp li b{font-weight:400;font-size:20px;line-height:1.3}
.grp li span{font-size:15px;color:var(--sub)}
/* projects */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:40px;padding:6px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:15px;background:transparent;color:var(--sub);border:1px solid var(--sub)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ptab{width:100%;border-collapse:collapse;table-layout:fixed}
.ptab th{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);text-align:left;padding:0 24px 8px 0}
.ptab td{padding:12px 24px 12px 0;border-top:1px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:baseline}
.ptab td.y,.ptab td.st,.ptab td.ct{color:var(--sub);font-size:15px}
.ptab td.i,.ptab td.n{font-size:18px}
.ptab td.p{color:var(--soft)}
.ptab .r{text-align:right;padding-right:0}
.ptab col.cy{width:76px}.ptab col.cp{width:158px}.ptab col.cc{width:124px}
.ptab td.p,.ptab td.ct{overflow:visible;text-overflow:clip}.ptab col.cs{width:90px}
.ptab caption{text-align:left;padding:48px 0 16px}
.ptab caption small{font-size:15px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--sub)}
@media (max-width:760px){
  .ptab,.ptab tbody,.ptab tr,.ptab td,.ptab caption{display:block;width:100%}
  .ptab thead,.ptab colgroup{display:none}
  .ptab tr{display:flex;flex-wrap:wrap;gap:2px 12px;padding:12px 0;border-top:1px solid var(--rule)}
  .ptab td,.ptab td.r{border:0;padding:0;white-space:normal;text-align:left;width:auto}
  .ptab td.i,.ptab td.n{flex:0 0 100%}
  .ptab td.i{color:var(--soft);font-size:16px}
  .ptab td.y,.ptab td.p,.ptab td.ct,.ptab td.st{font-size:14px;color:var(--sub)}
  .ptab td:empty{display:none}
  .ptab td.n{order:0}.ptab td.i{order:1}.ptab td.p{order:2}.ptab td.ct{order:3}.ptab td.y{order:4}.ptab td.st{order:5}
  .sel{grid-auto-rows:auto}
  .sel li{grid-template-columns:32px 1fr;grid-template-rows:none}
  .sel .no,.sel .iv,.sel .nm{grid-row:auto}
  .sel .iv,.sel .nm,.sel .pl,.sel .ty{grid-column:2;text-align:left;white-space:normal}
  .grp{grid-template-columns:1fr}
}
/* biro & contact */
.ppl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:40px}
.photo{aspect-ratio:4/5;background:var(--tile);display:flex;align-items:flex-end;padding:16px;font-size:14px;color:var(--sub);max-width:420px}
.pname{font-family:'Barlow Condensed',Arial,sans-serif;font-size:32px;line-height:1.1;margin-top:14px}
.big-link{font-family:'Barlow Condensed',Arial,sans-serif;font-size:clamp(34px,4vw,60px);font-weight:300;line-height:1.1;text-decoration:none;display:block}
.big-link.u{text-decoration:underline;text-underline-offset:8px;text-decoration-thickness:2px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:40px;margin-top:72px}
.cols h2{margin:0 0 12px}
address{font-style:normal;font-size:22px;line-height:1.45}
dl.kv{margin:0;display:flex;flex-direction:column;gap:6px}

.note{margin:72px 0 0;max-width:62ch;font-size:14px;color:var(--sub);border-left:2px solid var(--rule);padding-left:14px}
.ptools{display:flex;flex-wrap:wrap;gap:8px}
.ptools button{min-height:40px;padding:6px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:15px;background:transparent;color:var(--fg);border:1px solid var(--sub)}
.ptools button[aria-expanded="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* projekti s fotografijami: rdeča pika med letom in nazivom (telefon: pred nazivom) */
.ptab tr.ph td.y{position:relative}
.ptab tr.ph td.y::after{content:'';position:absolute;right:9px;top:50%;width:9px;height:9px;margin-top:-4px;border-radius:50%;background:var(--dot)}
@media (max-width:760px){.ptab tr.ph td.y::after{display:none}.ptab tr.ph td.n::before{content:'● ';color:var(--dot)}}
.ptab tr.ph{cursor:pointer}
.ptab td.i{text-transform:uppercase;letter-spacing:.04em;font-size:15px}
.sel .iv{font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);line-height:1.3}
.ptab tr.ph:hover td.n,.ptab tr.ph:focus-visible td.n{text-decoration:underline;text-underline-offset:4px}
#cf{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;color:#f2f2f2;background:rgba(8,8,8,.58);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding-top:env(safe-area-inset-top,0px);opacity:0;transition:opacity .25s}
#cf.on{display:flex}
#cf.in{opacity:1}
#cf .stage{position:relative;flex:1;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
#cf .stage.drag{cursor:grabbing}
#cf .track{position:absolute;left:0;top:50%;display:flex;align-items:center;gap:clamp(12px,2vw,28px);height:min(74vh,820px);transform:translate3d(0,-50%,0);transition:transform .5s cubic-bezier(.2,.7,.2,1);will-change:transform}
#cf .stage.drag .track{transition:none}
#cf .it{flex:none;opacity:.32;transition:opacity .4s;cursor:pointer}
#cf .it.cur{opacity:1;cursor:default}
#cf .it:not(.cur):hover{opacity:.5}
#cf .it img{height:min(74vh,820px);width:auto;max-width:min(78vw,1500px);object-fit:contain;display:block;pointer-events:none;box-shadow:0 18px 60px rgba(0,0,0,.45)}
#cf .bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 24px;padding:12px clamp(16px,3vw,40px) calc(20px + env(safe-area-inset-bottom,0px));text-shadow:0 1px 8px rgba(0,0,0,.6)}
#cf .t{font-family:'Barlow Condensed',Arial,sans-serif;font-size:clamp(22px,2.4vw,32px);font-weight:300;line-height:1.15}
#cf .m{color:#c8c8c8;font-size:15px}
#cf .x,#cf .nav{position:absolute;z-index:20;background:rgba(10,10,10,.35);border:0;border-radius:50%;color:#f2f2f2;cursor:pointer;font:inherit;width:52px;height:52px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .2s,opacity .2s}
#cf .x:hover,#cf .nav:hover{background:rgba(10,10,10,.7)}
#cf .x{top:calc(12px + env(safe-area-inset-top,0px));right:clamp(8px,2vw,24px);font-size:32px}
#cf .nav{top:50%;transform:translateY(-50%);font-size:40px;padding-bottom:4px}
#cf .prev{left:clamp(8px,2vw,28px)}#cf .next{right:clamp(8px,2vw,28px)}
#cf .nav[disabled]{opacity:0;pointer-events:none}
#cf :focus-visible{outline:2px solid #f2f2f2;outline-offset:3px}
@media (max-width:760px){#cf .track{height:min(62vh,560px)}#cf .it img{height:min(62vh,560px);max-width:86vw}#cf .nav{width:44px;height:44px;font-size:32px}}
.pmap{width:100%;height:auto;max-height:72vh;display:block;margin:8px 0 8px}
.pmap .nb{fill:none;stroke:var(--rule);stroke-width:1.5}
.pmap .si{fill:var(--tile);stroke:var(--sub);stroke-width:1.5}
.pmap .pin{cursor:pointer;outline:none}
.pmap .pin circle{fill:var(--sub);stroke:var(--bg);stroke-width:2;transition:fill .15s}
.pmap .pin:hover circle,.pmap .pin:focus-visible circle{fill:var(--fg)}
.pmap .pin.on circle{fill:var(--fg);stroke:var(--fg);stroke-width:3}
.pmap text{fill:var(--soft);font-size:17px;font-family:'Barlow Semi Condensed',Arial,sans-serif;pointer-events:none}
.placechip{align-self:flex-start;min-height:40px;padding:6px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:15px;background:var(--fg);color:var(--bg);border:1px solid var(--fg)}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px 40px;padding-top:32px;padding-bottom:40px;font-size:15px;color:var(--sub);border-top:1px solid var(--rule)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  el.querySelector('.prev').disabled = cfI === 0;
  el.querySelector('.next').disabled = cfI === n - 1;
  el.querySelector('.c').textContent = `${cfI + 1} / ${n}`;
}
window.addEventListener('resize', () => { if (cfP) { cfSize(); cfShow(); } });
function closeViewer(user) {
  const el = document.getElementById('cf');
  if (!el.classList.contains('on')) return;
  el.classList.remove('on', 'in'); el.setAttribute('aria-hidden', 'true'); el.innerHTML = '';
  document.body.style.overflow = ''; cfP = null;
  if (user && cfHist) { cfHist = false; history.back(); } else cfHist = false;
  if (cfBack && document.body.contains(cfBack)) cfBack.focus();
}
document.addEventListener('keydown', (e) => {
  if (!cfP) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); cfGo(cfI + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); cfGo(cfI - 1); }
  else if (e.key === 'Escape') { e.preventDefault(); closeViewer(true); }
  else if (e.key === 'Tab') { const f = [...document.querySelectorAll('#cf button:not([disabled])')]; const i = f.indexOf(document.activeElement); if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } }
});

function biro() {
  const b = S['biro_' + lang];
  return `<div class="intro"><h1 class="big" style="font-size:clamp(52px,7vw,108px)">${esc(b.tH1)}<span class="dot">.</span></h1><div class="lead" style="display:flex;flex-direction:column;gap:16px"><p style="margin:0">${esc(b.tP1)}</p><p style="margin:0">${esc(b.tP2)}</p></div></div>
  <section class="sec" aria-labelledby="h-abroad"><h2 class="lbl" id="h-abroad">${esc(b.tAbroad)}</h2><p class="cond" style="margin:0;font-size:clamp(40px,5.6vw,84px);font-weight:300;line-height:1">${esc(b.tAbroadDone)}<span class="dot">.</span></p><p class="lead">${esc(b.tAbroadP)}</p></section>
  <section class="sec"><h2 class="lbl">${esc(b.tPeople)}</h2><div class="ppl"><div style="grid-column:1/-1"><div class="pname" style="margin-top:0">Miha Volk</div><div style="color:var(--soft)">${esc(b.tRole1)}</div><div style="color:var(--sub)">${esc(b.tRole2)}</div></div>${(b.team || []).map(([n, r]) => `<div><div class="pname" style="margin-top:0;font-size:22px">${esc(n)}</div><div style="color:var(--sub)">${esc(r)}</div></div>`).join('')}</div>${b.former && b.former.length ? `<div style="margin-top:32px;font-size:20px;color:var(--soft)">${esc(b.tFormer)}: ${b.former.map(esc).join(', ')} …</div>` : ''}<p class="lead" style="margin-top:24px">${esc(b.tTeam)}</p></section>
  `;
}

function contact() {
  const k = S['kont_' + lang];
  return `<div class="intro"><h1 class="big" style="font-size:clamp(52px,7vw,108px)">${esc(k.tH1)}<span class="dot">.</span></h1><div><a class="big-link u" href="mailto:info@birovolk.si">info@birovolk.si</a><a class="big-link" href="tel:+38641842899">+386 41 842 899</a></div></div>
  <div class="cols"><div><h2 class="lbl">${esc(k.tVisit)}</h2><address>BIRO VOLK d.o.o.<br>Kersnikova ulica 6<br>SI-1000 Ljubljana</address><p style="color:var(--sub);margin:8px 0">${esc(k.tAppt)}</p><a href="https://www.google.com/maps/search/?api=1&amp;query=BIRO%20VOLK%2C%20Kersnikova%20ulica%206%2C%201000%20Ljubljana" target="_blank" rel="noopener">${esc(k.tMap)} ↗</a></div>
  <div><h2 class="lbl">${esc(k.tFollow)}</h2><a href="https://www.instagram.com/birovolk/" target="_blank" rel="noopener" style="font-size:22px;text-decoration:none">Instagram · @birovolk</a></div>
  <div><h2 class="lbl">${esc(k.tInvoice)}</h2><dl class="kv">${k.billing.map(b => `<div><dt>${esc(b.l)}</dt><dd>${esc(b.v)}</dd></div>`).join('')}</dl></div></div>
  <p class="note">${esc(k.tPrivacy)}</p>`;
}

function render(focus) {
  document.documentElement.lang = lang;
  document.documentElement.dataset.theme = theme;
  const v = view();
  document.title = UI[lang].titles[v];
  renderNav();
  const main = document.getElementById('main');
  main.innerHTML = v === 'storitve' ? services() : v === 'projekti' ? projects() : v === 'biro' ? biro() : v === 'kontakt' ? contact() : home();
  main.querySelectorAll('tr.ph').forEach(r => { const go = () => openViewer((window._plist || [])[+r.dataset.i], r); r.onclick = go; r.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }; });
  main.querySelectorAll('.ptools [data-t]').forEach(b => b.onclick = () => { if (b.dataset.t === 'map') showMap = !showMap; else showFilters = !showFilters; render(false); const nb = document.querySelector(`.ptools [data-t="${b.dataset.t}"]`); if (nb) nb.focus(); });
  closeViewer();
  main.querySelectorAll('.pmap .pin').forEach(g => { const go = () => { placeSel = placeSel === g.dataset.k ? null : g.dataset.k; render(false); const n = document.querySelector(`.pmap .pin[data-k="${placeSel || g.dataset.k}"]`); if (n) n.focus(); }; g.onclick = go; g.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } }; });
  const pc = main.querySelector('.placechip'); if (pc) pc.onclick = () => { placeSel = null; render(false); };
  main.querySelectorAll('.chips [data-c]').forEach(b => b.onclick = () => { cat = b.dataset.c; render(false); const btn = document.querySelector(`.chips [data-c="${cat}"]`); if (btn) btn.focus(); });
  fitCols(main);
  if (focus) { window.scrollTo(0, 0); main.focus({ preventScroll: true }); }
}
// stolpca Kraj in Sklop: širina po najdaljšem vpisu (prva stran in Projekti)
function fitCols(root) {
  const w = (els) => Math.ceil(Math.max(0, ...[...els].map(e => { const r = document.createRange(); r.selectNodeContents(e); return r.getBoundingClientRect().width; })));
  const sel = root.querySelector('.sel');
  if (sel) { sel.style.setProperty('--wp', w(sel.querySelectorAll('.pl')) + 'px'); sel.style.setProperty('--wc', w(sel.querySelectorAll('.ty')) + 'px'); }
  const t = root.querySelector('.ptab'), cp = t && t.querySelector('col.cp'), cc = t && t.querySelector('col.cc');
  if (cp) cp.style.width = (w(t.querySelectorAll('td.p, th:nth-child(4)')) + 24) + 'px';
  if (cc) cc.style.width = w(t.querySelectorAll('td.ct, th.r')) + 'px';
}
if (document.fonts) document.fonts.ready.then(() => fitCols(document.getElementById('main')));
// Notranje povezave (meni, logotip, jezik) brez ponovnega nalaganja strani; naslov v brskalniku se zamenja.
function go(v, l, pn) {
  if (v === cur && l === lang && !pn) { window.scrollTo(0, 0); return; }
  const focus = v !== cur && !pn;
  cur = v; lang = l; cat = 'all'; placeSel = null;
  history.pushState({ v, l }, '', href(v, l) + (pn ? '#p-' + pn : ''));
  closeViewer(); render(focus);
  if (pn) showProject(pn);
}
// izpostavljeni projekt: pomik do njegove vrstice na strani Projekti in kratka osvetlitev
function showProject(pn, instant) {
  const r = document.getElementById('p-' + pn); if (!r) return;
  r.scrollIntoView({ block: 'center', behavior: instant || matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  r.classList.remove('hit'); void r.offsetWidth; r.classList.add('hit');
  if (r.tabIndex >= 0) r.focus({ preventScroll: true });
}
document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('a[data-v]');
  if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault(); go(a.dataset.v, a.dataset.l || lang, a.dataset.p);
});
window.addEventListener('popstate', (e) => { const st = e.state || { v: PAGE.v || '', l: PAGE.lang };
  if (cfP || cfHist) { const same = st.v === cur && st.l === lang; cfHist = false; closeViewer(); if (same) return; }
  cur = st.v; lang = st.l; cat = 'all'; placeSel = null; closeViewer(); render(true); });
history.replaceState({ v: cur, l: lang }, '');
render(false);
{ const h = (location.hash || '').replace('#', ''); if (h.startsWith('p-')) { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; addEventListener('load', () => setTimeout(() => showProject(h.slice(2), true), 0)); } }
</script>
</body>
